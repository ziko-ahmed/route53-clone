# Deploys the backend on Render (https://render.com).
# The frontend goes on Vercel -- see the Deployment section of README.md.
#
# The database is NOT defined here. Render's free web services cannot attach
# a persistent disk, and Render's own free Postgres expires 30 days after it
# is created. So the database lives on Neon instead, and you paste its
# connection string into DATABASE_URL in the Render dashboard.

services:
  - type: web
    name: route53-clone-api
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: DATABASE_URL
        # sync: false means "ask me for this in the dashboard, do not commit it".
        # Never put a real connection string in this file -- it holds a password.
        sync: false
      - key: ALLOWED_ORIGINS
        # Set this to your Vercel URL once the frontend is deployed.
        sync: false
