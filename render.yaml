# Deploys the backend on Render (https://render.com).
# The frontend goes on Vercel -- see the Deployment section of README.md.

services:
  - type: web
    name: route53-clone-api
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: DATABASE_URL
        value: sqlite:////data/route53.db
      - key: ALLOWED_ORIGINS
        # Change this to your Vercel URL after the frontend is deployed.
        value: https://route53-clone.vercel.app
    disk:
      name: route53-data
      mountPath: /data
      sizeGB: 1
